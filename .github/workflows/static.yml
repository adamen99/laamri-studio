name: Deploy Vite site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: List all directories after build
        run: |
          echo "=== Root directory ==="
          ls -la
          echo ""
          echo "=== Looking for build outputs ==="
          find . -type d -name "dist" -not -path "*/node_modules/*" 2>/dev/null || true
          find . -type d -name "build" -not -path "*/node_modules/*" 2>/dev/null || true
          find . -type d -name "out" -not -path "*/node_modules/*" 2>/dev/null || true
          find . -type d -name ".output" -not -path "*/node_modules/*" 2>/dev/null || true
          find . -type d -name ".vinxi" -not -path "*/node_modules/*" 2>/dev/null || true
          find . -type d -name ".nitro" -not -path "*/node_modules/*" 2>/dev/null || true
          echo ""
          echo "=== Looking for index.html files ==="
          find . -name "index.html" -not -path "*/node_modules/*" 2>/dev/null || true
