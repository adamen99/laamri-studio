name: Deploy Vite site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Find build output directory
        id: find_dir
        run: |
          if [ -d "./dist" ]; then
            echo "build_dir=./dist" >> $GITHUB_OUTPUT
          elif [ -d "./build" ]; then
            echo "build_dir=./build" >> $GITHUB_OUTPUT
          elif [ -d "./.output/public" ]; then
            echo "build_dir=./.output/public" >> $GITHUB_OUTPUT
          elif [ -d "./out" ]; then
            echo "build_dir=./out" >> $GITHUB_OUTPUT
          else
            echo "No build directory found!"
            ls -la
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_dir.outputs.build_dir }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
